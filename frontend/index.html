<!doctype html>
<html lang="uz">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#f7f8fc" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0f1424" media="(prefers-color-scheme: dark)" />
    <meta name="description" content="E-davomat — elektron davomat tizimi" />
    <title>E-davomat</title>
    <script>
      (function () {
        try {
          var lang = localStorage.getItem("edavomat-lang");
          if (lang) document.documentElement.lang = lang;
          var t = localStorage.getItem("edavomat-theme") || "system";
          var dark = t === "dark" || (t === "system" && matchMedia("(prefers-color-scheme: dark)").matches);
          if (dark) document.documentElement.classList.add("dark");
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
